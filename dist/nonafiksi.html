:root{--kopi:#1a120d;--kayu:#2a1d14;--kayu2:#3a2a1c;--kertas:#f2e8d5;--kertas2:#e4d5b8;
--tinta:#303b7a;--terakota:#c4553b;--kunyit:#e3a62f}
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--kopi);overflow:hidden}
body{font-family:'VT323',monospace;color:var(--kertas);display:flex;flex-direction:column}
.hud{display:flex;justify-content:space-between;align-items:center;
  font-family:'PS2P',monospace;font-size:8px;color:var(--kertas2);padding:8px 10px;letter-spacing:1px}
.hud b{color:var(--kunyit);font-weight:normal}
#phasebtn{cursor:pointer;border:2px solid var(--kayu2);padding:4px 6px;background:var(--kayu);color:var(--kunyit)}
.screen{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;
  touch-action:none} /* pan gestures fire pointercancel and kill the joystick */
canvas{image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#cv{height:min(calc(100vh - 128px), calc((100vw - 10px) * 256 / 144));
  border:3px solid var(--kayu2);box-shadow:0 0 0 3px #000,0 10px 40px rgba(0,0,0,.6);background:#000}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s}
.fade.on{opacity:1}
/* thumb joystick — faint, spawns where the thumb lands */
#joy{position:absolute;width:76px;height:76px;border-radius:50%;display:none;pointer-events:none;
  border:2px solid rgba(242,232,213,.22);background:rgba(242,232,213,.05)}
#jnub{position:absolute;width:30px;height:30px;border-radius:50%;
  background:rgba(242,232,213,.22);border:2px solid rgba(242,232,213,.3)}
#hint{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;
  pointer-events:none;padding-bottom:56px}
#hint.on{display:flex}
#hint .hcard{font-family:'PS2P',monospace;font-size:8px;color:var(--kertas);text-align:center;
  background:rgba(26,18,13,.85);border:2px solid var(--kayu2);padding:10px 12px;line-height:1.9;
  animation:hpulse 1.6s ease-in-out infinite}
#hint .hring{display:block;width:34px;height:34px;margin:8px auto 0;border-radius:50%;
  border:2px solid rgba(242,232,213,.4);position:relative}
#hint .hring::after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;
  background:rgba(242,232,213,.5);top:9px;left:9px;animation:hdrift 1.6s ease-in-out infinite}
@keyframes hpulse{50%{opacity:.75}}
@keyframes hdrift{0%,100%{transform:translate(0,0)}25%{transform:translate(7px,0)}
  50%{transform:translate(0,-7px)}75%{transform:translate(-7px,0)}}
/* title screen */
#title{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;background:rgba(10,7,5,.5);text-align:center;padding:16px}
#title.on{display:flex}
#title h1{font-family:'PS2P',monospace;font-size:22px;color:var(--kertas);margin:0;
  text-shadow:3px 3px 0 var(--tinta),6px 6px 0 rgba(0,0,0,.6);letter-spacing:2px}
#title .tag{font-size:22px;color:var(--kertas2);margin:10px 0 22px;text-shadow:2px 2px 0 #000}
#tbtns,#chsel{display:flex;flex-direction:column;gap:8px;width:min(78%,260px)}
#chsel{display:none}
#chsel .csl{font-family:'PS2P',monospace;font-size:9px;color:var(--kunyit);margin:0 0 4px;
  text-shadow:2px 2px 0 #000}
.chrow{display:flex;justify-content:center;gap:10px}
.chcard{background:var(--kertas);border:3px solid var(--kopi);box-shadow:3px 3px 0 rgba(0,0,0,.5);
  padding:6px;cursor:pointer;line-height:0}
.chprev{width:48px;height:48px}
.chc{font-family:'PS2P',monospace;font-size:9px;text-align:left;padding:9px 10px;cursor:pointer;
  background:var(--kertas);color:var(--kopi);border:2px solid var(--kopi);box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.chc.lock{background:var(--kayu2);color:var(--kertas2)}
.chc.sel{outline:3px solid var(--kunyit);outline-offset:-1px}
#title .chc{text-align:center}
.dialog{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  width:min(94%,540px);background:var(--kayu);border:3px solid var(--kertas);
  box-shadow:0 0 0 3px var(--kayu2),5px 5px 0 rgba(0,0,0,.5);padding:10px 14px 12px;display:none}
.dialog.on{display:block}
.dialog .who{position:absolute;top:-15px;left:8px;font-family:'PS2P',monospace;font-size:8px;
  background:var(--kunyit);color:var(--kopi);border:2px solid var(--kopi);padding:3px 7px}
#dclose{position:absolute;top:-15px;right:8px;font-family:'PS2P',monospace;font-size:8px;
  background:var(--terakota);color:var(--kertas);border:2px solid var(--kopi);padding:3px 7px;cursor:pointer}
.dialog p{margin:4px 0 0;font-size:22px;line-height:1.25}
#dinput{display:none;width:100%;margin-top:8px;font-family:'VT323',monospace;font-size:22px;
  background:var(--kopi);color:var(--kertas);border:2px solid var(--kertas2);padding:6px 8px;outline:none}
#dchoices{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:42vh;overflow-y:auto}
.popup{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
.popup.on{display:flex}
.pcard{width:min(88%,420px);background:var(--kertas);color:var(--kopi);border:3px solid var(--kopi);
  box-shadow:0 0 0 3px var(--kertas2),6px 6px 0 rgba(0,0,0,.5);padding:14px}

function spr(map, pal) { pal = pal || PAL;
  const w = Math.max(...map.map(r=>r.length)), h = map.length,
    oc = document.createElement('canvas'); oc.width = w; oc.height = h;
  const o = oc.getContext('2d');
  map.forEach((r,y)=>{ for(let x=0;x<r.length;x++){ const c=pal[r[x]||'.'];
    if(c){ o.fillStyle=c; o.fillRect(x,y,1,1); } } });
  return oc; }

// ---------- asset loading + grading ----------

function gradeImg(img) {
  const oc=document.createElement('canvas'); oc.width=img.width; oc.height=img.height;
  const o=oc.getContext('2d'); o.drawImage(img,0,0);
  const d=o.getImageData(0,0,oc.width,oc.height), p=d.data;
  for(let i=0;i<p.length;i+=4){ if(p[i+3]<120){p[i+3]=0;continue;}
    let br=0,bd=1e9; for(let r=0;r<RAMP_MALAM.length;r++){
      const a=p[i]-RAMP_MALAM[r][0],b=p[i+1]-RAMP_MALAM[r][1],c2=p[i+2]-RAMP_MALAM[r][2];
      const dist=a*a*2+b*b*3+c2*c2; if(dist<bd){bd=dist;br=r;} }
    p[i]=RAMP_MALAM[br][0];p[i+1]=RAMP_MALAM[br][1];p[i+2]=RAMP_MALAM[br][2];p[i+3]=255; }
  o.putImageData(d,0,0); return oc; }
function loadSheets(srcMap) {
  return Promise.all(Object.entries(srcMap).map(([k,u])=>new Promise(res=>{
    const im=new Image(); im.onload=()=>{ const oc=document.createElement('canvas');
      oc.width=im.width; oc.height=im.height; oc.getContext('2d').drawImage(im,0,0);
      A.raw[k]=oc; A.malam[k]=gradeImg(im); res(); }; im.src=u; })));
}

// ---------- NPC brains — all data-driven from scene npc entries ----------
// {y0,y1} vertical ping-pong · {x0,x1} horizontal patrol · {wander:[x,y,w,h]}
// amble-and-pause · {chase:'id',ox,oy} follow a leader (kid-chasing-dog pairs)
// · {static:'down'} stand · {anim:[maps],animMs} 2-frame custom (bartender)
function stepNpc(n,sc,t){
  n._mov=false;
  if(n.static){ n.dir=n.static; return; }
  const sp=(n.speed||22)/60;
  if(n.y1!=null){ n.y=(n.y??n.y0)+(n.dirDown?1:-1)*sp;
    if(n.y>n.y1)n.dirDown=false; if(n.y<n.y0)n.dirDown=true;
    n.dir=n.dirDown?'down':'up'; n._mov=true; return; }
  if(n.x1!=null){ n.x=(n.x??n.x0)+(n.dirRight?1:-1)*sp;
    if(n.x>n.x1)n.dirRight=false; if(n.x<n.x0)n.dirRight=true;
    n.dir=n.dirRight?'right':'left'; n._mov=true; return; }
  let tx=null,ty=null;
  if(n.chase){ const L=(sc.npcs||[]).find(m=>m.id===n.chase);
    if(L){ tx=L.x+(n.ox||0); ty=L.y+(n.oy||0); } }
  else if(n.wander){ const r=n.wander;
    if(n._wait>0){ n._wait-=1/60; return; }
    if(n._tx==null||(Math.abs(n._tx-n.x)<2&&Math.abs(n._ty-n.y)<2)){
      n._tx=r[0]+rnd((n.x*3)|0,(t/900)|0)*r[2]; n._ty=r[1]+rnd((t/900)|0,(n.y*3)|0)*r[3];
      n._wait=1+2*rnd((n.x+t/1000)|0,(n.y*7)|0); return; }
    tx=n._tx; ty=n._ty; }
  if(tx==null)return;
  const dx=tx-n.x,dy=ty-n.y,d=Math.hypot(dx,dy);
  if(d<(n.chase?5:2))return;
  n.x+=dx/d*sp; n.y+=dy/d*sp;
  n.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
  n._mov=true;
}

function drawScene(sc,t){
  (GROUNDS[sc.ground]||GROUNDS.street)(sc,t);
  (sc.decos||[]).forEach(d=>DECOS[d.type]&&DECOS[d.type](d,t));
  const ents=[];
  sc.placements.forEach(pl=>{
    const c=CATALOG[pl.component]; if(!c)return;
    const draw = ()=>{ if(c.custom)X.drawImage(A.custom[c.custom],pl.x,pl.y);
      else if(c.sheet)X.drawImage(img(c.sheet),c.sx,c.sy,c.w,c.h,pl.x,pl.y,c.w,c.h);
      (c.fx||[]).forEach(f=>FX[f]&&FX[f]({...pl,w:c.w||16,h:c.h||16,...(c.fxArgs||{})},t)); };
    if(c.flat)draw(); else ents.push({y:pl.y+(c.h||(A.custom[c.custom]||{}).height||16),draw});
  });
  (sc.npcs||[]).forEach(n=>{
    stepNpc(n,sc,t);
    const cKey=n.anim?n.anim[(t/(n.animMs||600)|0)%n.anim.length]:n.custom;
    const h=cKey?(A.custom[cKey]||{}).height||18:0;
    ents.push({y:cKey?n.y+h:n.y,draw:()=>{
      if(cKey)return X.drawImage(A.custom[cKey],n.x,n.y);
      if(n.strip){ // 2-frame side-view sheets (Ninja animals): flip-x for left
        if(n.dir==='left'||n.dir==='right')n._face=n.dir;
        const fw=n.fw||16,fh=n.fh||16,f=n._mov?(t/160|0)%(n.frames||2):0;
        X.save(); X.translate(n.x|0,(n.y-fh)|0);
        if(n._face==='left'){X.scale(-1,1);}
        X.drawImage(img(n.strip),f*fw,0,fw,fh,-(fw/2|0),0,fw,fh);
        X.restore(); return; }
      drawChar(n.k,n.x,n.y,n.dir||'down',n._mov?(t/180|0)%(n.frames||4):0);}});
  });
  (sc.fx||[]).forEach(f=>FX[f.type]&&FX[f.type](f,t));
  ents.filter(e=>e.y<=st.y).sort((a,b)=>a.y-b.y).forEach(e=>e.draw());
  if(!st.hidePlayer)drawChar(st.playerSheet||'boy',st.x,st.y,st.dir,st.moving?st.frame:0);
  ents.filter(e=>e.y>st.y).sort((a,b)=>a.y-b.y).forEach(e=>e.draw());
}

// ---------- collision / zones ----------
function hits(sc,x,y){ const bx=x-5,by=y-5;
  return (sc.colliders||[]).some(c=>bx<c[0]+c[2]&&bx+10>c[0]&&by<c[1]+c[3]&&by+5>c[1]); }
const inZone=(z)=>z&&st.x>z.x&&st.x<z.x+z.w&&st.y>z.y-6&&st.y<z.y+z.h+10;
function nearestInteract(sc){
  let best=null,bd=1e9;
  sc.placements.forEach(pl=>{ const c=CATALOG[pl.component];
    if(!c||!(pl.interact||c.interact))return;
    const cx=pl.x+(c.w||12)/2, cy=pl.y+(c.h||12);
    const d=Math.abs(cx-st.x)+Math.abs(cy-st.y);
    if(d<30&&d<bd){bd=d;best={...(c.interact||{}),...(pl.interact||{})};} });
  return best; }

function stepDlg(){
  const d=st.dlg; if(!d)return closeDlg();
  const s=d.script[d.i];
  if(!s)return closeDlg();
  ui.dlg.classList.add('on'); ui.who.textContent=d.who;

  ui.dchoices.innerHTML='';
  if(s.choices){ s.choices.forEach(ch=>{ const b=document.createElement('button');
      b.className='chc'+(ch.locked?' lock':''); b.textContent=ch.label;
      b.onpointerdown=e=>{e.preventDefault();e.stopPropagation();
        if(ch.locked){ui.dtxt.textContent=ch.lockedMsg||'Belum terbuka. ✦';d.typed=1e9;return;}
        d.i++; (ch.then||(()=>{}))(); if(st.dlg===d)stepDlg(); };
      ui.dchoices.appendChild(b); }); }
  d.typed=0; d.text=(typeof s.say==='function'?s.say():s.say)||'';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){d.typed=d.text.length;}
  ui.dtxt.textContent=d.text.slice(0,d.typed);
  if(s.input){ ui.dinput.value=''; ui.dinput.placeholder=s.placeholder||''; setTimeout(()=>ui.dinput.focus(),50); }

function advDlg(){ const d=st.dlg; if(!d)return;
  const s=d.script[d.i];
  if(d.typed<d.text.length){ d.typed=d.text.length; ui.dtxt.textContent=d.text; return; }
  if(s.choices){ // choices + free-typed input can coexist (Yose: "ketik sendiri")
    if(s.input){ const v=ui.dinput.value.trim();
      if(v){ (s.onfree||(()=>{}))(v); if(st.dlg===d){d.i++;stepDlg();} } }
    return; }
  if(s.input){ const v=ui.dinput.value.trim(); if(!v)return ui.dinput.focus();
    (s.oninput||(()=>{}))(v); }
  if(s.action)s.action();
  d.i++; if(st.dlg===d)stepDlg(); }

// ---------- input ----------
const keys={};
function bindUI(){
  // floating thumb joystick — spawns faint at the touch point, whole screen is the pad
  const scr=document.querySelector('.screen'); let joyId=null,jcx=0,jcy=0;
  scr.addEventListener('pointerdown',e=>{
    if(st.mode!=='play'||st.dlg||ui.pop.classList.contains('on')||joyId!==null)return;
    if(e.target!==cvs&&e.target!==scr)return;
    e.preventDefault(); joyId=e.pointerId; jcx=e.clientX; jcy=e.clientY;
    const r=scr.getBoundingClientRect();
    ui.joy.style.left=(jcx-r.left-38)+'px'; ui.joy.style.top=(jcy-r.top-38)+'px';
    ui.joy.style.display='block'; ui.jnub.style.left='21px'; ui.jnub.style.top='21px';
    try{scr.setPointerCapture(e.pointerId);}catch(err){} });
  scr.addEventListener('pointermove',e=>{
    if(e.pointerId!==joyId)return;
    let dx=e.clientX-jcx, dy=e.clientY-jcy; const m=Math.hypot(dx,dy);
    if(m>28){dx*=28/m;dy*=28/m;}
    ui.jnub.style.left=(21+dx)+'px'; ui.jnub.style.top=(21+dy)+'px';
    st.jx=Math.abs(dx)<6?0:dx/28; st.jy=Math.abs(dy)<6?0:dy/28; });
  const jend=e=>{ if(e.pointerId!==joyId)return;
    joyId=null; st.jx=st.jy=0; ui.joy.style.display='none'; };
  scr.addEventListener('pointerup',jend); scr.addEventListener('pointercancel',jend);
  ui.dclose.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();closeDlg();});
  const KM={ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',ArrowUp:'U',w:'U',ArrowDown:'D',s:'D'};
  addEventListener('keydown',e=>{ if(document.activeElement===ui.dinput){ if(e.key==='Enter')advDlg(); return; }
    // arrow-key selection on dialog choices (desktop)
    if(st.dlg){ const chc=[...ui.dchoices.querySelectorAll('button.chc')];
      if(chc.length){
        if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault();
          let i=chc.findIndex(b=>b.classList.contains('sel'));
          chc.forEach(b=>b.classList.remove('sel'));
          i=e.key==='ArrowDown'?(i+1)%chc.length:(i<=0?chc.length-1:i-1);
          chc[i].classList.add('sel'); return; }
        if(e.key==='Enter'||e.key==='e'||e.key===' '){
          const s=chc.find(b=>b.classList.contains('sel'));
          if(s){ e.preventDefault();
            s.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true})); return; } } } }
    if(KM[e.key]){e.preventDefault();keys[KM[e.key]]=true;}
    if(e.key==='e'||e.key==='Enter'||e.key===' '){e.preventDefault();act();} });
  addEventListener('keyup',e=>{ if(KM[e.key])keys[KM[e.key]]=false; });
  ui.ctx.addEventListener('pointerdown',e=>{e.preventDefault();act();});
  ui.dlg.addEventListener('pointerdown',e=>{ if(e.target===ui.dinput||e.target.tagName==='BUTTON')return;
    e.preventDefault(); advDlg(); });         // FIX: tap dialog to advance
  ui.pclose.addEventListener('pointerdown',e=>{e.preventDefault();ui.pop.classList.remove('on');});
  ui.phasebtn.addEventListener('pointerdown',e=>{e.preventDefault();
    const order=[null,...PHASES]; st.phaseOverride=order[(order.indexOf(st.phaseOverride)+1)%order.length];
    ui.phasebtn.textContent=(st.phaseOverride||'auto').toUpperCase()+' ✦'; });
}
function act(){
  if(st.mode!=='play')return;
  if(st.dlg){advDlg();return;}
  if(ui.pop.classList.contains('on')){ui.pop.classList.remove('on');return;}
  const sc=SCENES[st.scene];
  const ex=(sc.exits||[]).find(inZone);
  if(sc.talk&&inZone(sc.talk)){ (sc.onTalk||(()=>{}))(); return; }
  const it=nearestInteract(sc); if(it){ popup(it); return; }
  if(ex){ if(ex.menu)return (sc.onMenu||(()=>{}))(ex);
    if(ex.locked)return popup({title:'Terkunci',body:ex.locked});
    goto(ex.to,ex.sx,ex.sy); } }

// ---------- main loop ----------
let last=0,READY=false;
function loop(t){
  const dt=Math.min(32,t-last)/1000; last=t;
  if(!READY){requestAnimationFrame(loop);return;}
  const sc=SCENES[st.scene];
  if(st.mode==='title'){ // attract: slow camera drift over the street, no player
    const camY=(Math.sin(t/12000)*.5+.5)*Math.max(0,sc.H-256);
    X.setTransform(1,0,0,1,0,0); X.clearRect(0,0,144,256); X.translate(0,-camY);
    drawScene(sc,t); X.setTransform(1,0,0,1,0,0);
    const tov=OVERLAY[phase()]; if(tov){X.fillStyle=tov;X.fillRect(0,0,144,256);}
    ui.chprevs.forEach(c=>{ const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
      g.clearRect(0,0,16,16); g.drawImage(img(c.dataset.k),0,((t/200|0)%4)*16,16,16,0,0,16,16); });
    requestAnimationFrame(loop); return; }
  st.moving=false;
  if(!st.dlg&&!st.fading&&!ui.pop.classList.contains('on')){
    let dx=(keys.R?1:0)-(keys.L?1:0)+st.jx, dy=(keys.D?1:0)-(keys.U?1:0)+st.jy;
    const mag=Math.hypot(dx,dy); if(mag>1){dx/=mag;dy/=mag;}
    if(Math.abs(dx)>.05||Math.abs(dy)>.05){st.moving=true;
      if(ui.hint.classList.contains('on')){ui.hint.classList.remove('on');
        try{localStorage.nf_hint=1;}catch(e){}}
      st.dir=Math.abs(dy)>=Math.abs(dx)?(dy>0?'down':'up'):(dx>0?'right':'left');
      const nx=Math.max(8,Math.min(sc.W-8,st.x+dx*56*dt)),
            ny=Math.max(12,Math.min(sc.H-3,st.y+dy*56*dt));
      if(!hits(sc,nx,st.y))st.x=nx; if(!hits(sc,st.x,ny))st.y=ny; } }
  st.ft+=dt; if(st.ft>.14){st.ft=0;st.frame=(st.frame+1)%4;}
  // context button — FIX: stays live as LANJUT while dialog is open
  const ex=(sc.exits||[]).find(inZone), talk=sc.talk&&inZone(sc.talk), it=nearestInteract(sc);
  ui.ctx.textContent=st.dlg?'▼ LANJUT':(talk?'✦ BICARA':(it?'✦ PERIKSA':(ex?ex.label:'')));
  ui.ctx.classList.toggle('on',!!(st.dlg||talk||ex||it));
  if(st.dlg&&st.dlg.typed<st.dlg.text.length){
    st.dlg.typed=Math.min(st.dlg.text.length,st.dlg.typed+dt*38);
    ui.dtxt.textContent=st.dlg.text.slice(0,st.dlg.typed|0); }
  const camY=Math.max(0,Math.min(sc.H-256,st.y-150));
  X.setTransform(1,0,0,1,0,0); X.clearRect(0,0,144,256); X.translate(0,-camY);
  drawScene(sc,t);
  X.setTransform(1,0,0,1,0,0);
  const ov=OVERLAY[phase()]; if(ov){X.fillStyle=ov;X.fillRect(0,0,144,256);}
  if(phase()==='malam'){ const v=X.createRadialGradient(72,130,70,72,130,190);
    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.42)');
    X.fillStyle=v; X.fillRect(0,0,144,256); }
  requestAnimationFrame(loop); }

// ---------- boot ----------
async function init(bundle){
  CATALOG=bundle.catalog; SCENES=bundle.scenes;
  cvs=document.getElementById('cv'); X=cvs.getContext('2d'); X.imageSmoothingEnabled=false;
  ['loc','ctx','dlg','who','dtxt','dinput','dchoices','fade','pop','ptitle','pbody','plink','pclose',
   'phasebtn','joy','jnub','hint','title','dclose']
    .forEach(id=>ui[id]=document.getElementById(id));
  ui.chprevs=[...document.querySelectorAll('.chprev')];
  Object.entries(MAPS).forEach(([k,m])=>A.custom[k]=spr(m));
  await loadSheets(bundle.sheets);
  bundle.wire(api); // scenes get their scripts (onTalk, onMenu, first-visit)
  st.scene=bundle.start; ui.loc.textContent=SCENES[st.scene].name;
  st.x=SCENES[st.scene].spawn[0]; st.y=SCENES[st.scene].spawn[1];
  st.mode='title'; st.hidePlayer=true; ui.title.classList.add('on');
  ui.loc.textContent='NONAFIKSI';
  bindUI(); READY=true; requestAnimationFrame(loop); }

// leave the title screen and enter the world
function begin(name,sx,sy){
  ui.title.classList.remove('on'); st.mode='play'; st.hidePlayer=false;
  goto(name,sx,sy);
  if(!localStorage.nf_hint)ui.hint.classList.add('on'); }

const api={ init,goto,begin,runScript,popup,closeDlg,persona,generateHome,
  scenes:()=>SCENES,state:st,phase,sheet:img };
return api; })();
</script>

"use strict";
var qrcodegen;

    /*---- QR Code symbol class ----*/
    /*
     * A QR Code symbol, which is a type of two-dimension barcode.
     * Invented by Denso Wave and described in the ISO/IEC 18004 standard.
     * Instances of this class represent an immutable square grid of dark and light cells.
     * The class provides static factory functions to create a QR Code from text or binary data.
     * The class covers the QR Code Model 2 specification, supporting all versions (sizes)
     * from 1 to 40, all 4 error correction levels, and 4 character encoding modes.
     *
     * Ways to create a QR Code object:
     * - High level: Take the payload data and call QrCode.encodeText() or QrCode.encodeBinary().
     * - Mid level: Custom-make the list of segments and call QrCode.encodeSegments().
     * - Low level: Custom-make the array of data codeword bytes (including
     *   segment headers and final padding, excluding error correction codewords),
     *   supply the appropriate version number, and call the QrCode() constructor.
     * (Note that all ways require supplying the desired error correction level.)
     */
    class QrCode {
        /*-- Constructor (low level) and fields --*/
        // Creates a new QR Code with the given version number,
        // error correction level, data codeword bytes, and mask number.
        // This is a low-level API that most users should not use directly.
        // A mid-level API is the encodeSegments() function.
        constructor(
        // The version number of this QR Code, which is between 1 and 40 (inclusive).
        // This determines the size of this barcode.
        version, 
        // The error correction level used in this QR Code.
        errorCorrectionLevel, dataCodewords, msk) {
            this.version = version;
            this.errorCorrectionLevel = errorCorrectionLevel;
            // The modules of this QR Code (false = light, true = dark).
            // Immutable after constructor finishes. Accessed through getModule().
            this.modules = [];
            // Indicates function modules that are not subjected to masking. Discarded when constructor finishes.
            this.isFunction = [];
            // Check scalar arguments
            if (version < QrCode.MIN_VERSION || version > QrCode.MAX_VERSION)
                throw new RangeError("Version value out of range");
            if (msk < -1 || msk > 7)
                throw new RangeError("Mask value out of range");
            this.size = version * 4 + 17;
            // Initialize both grids to be size*size arrays of Boolean false
            let row = [];
            for (let i = 0; i < this.size; i++)
                row.push(false);
            for (let i = 0; i < this.size; i++) {
                this.modules.push(row.slice()); // Initially all light
                this.isFunction.push(row.slice());
            }
            // Compute ECC, draw modules
            this.drawFunctionPatterns();
            const allCodewords = this.addEccAndInterleave(dataCodewords);
            this.drawCodewords(allCodewords);
            // Do masking
            if (msk == -1) { // Automatically choose best mask
                let minPenalty = 1000000000;
                for (let i = 0; i < 8; i++) {
                    this.applyMask(i);
                    this.drawFormatBits(i);
                    const penalty = this.getPenaltyScore();
                    if (penalty < minPenalty) {
                        msk = i;
                        minPenalty = penalty;
                    }
                    this.applyMask(i); // Undoes the mask due to XOR
                }
            }
            assert(0 <= msk && msk <= 7);
            this.mask = msk;
            this.applyMask(msk); // Apply the final choice of mask
            this.drawFormatBits(msk); // Overwrite old format bits
            this.isFunction = [];
        }
        /*-- Static factory functions (high level) --*/
        // Returns a QR Code representing the given Unicode text string at the given error correction level.
        // As a conservative upper bound, this function is guaranteed to succeed for strings that have 738 or fewer
        // Unicode code points (not UTF-16 code units) if the low error correction level is used. The smallest possible
        // QR Code version is automatically chosen for the output. The ECC level of the result may be higher than the
        // ecl argument if it can be done without increasing the version.
        static encodeText(text, ecl) {
            const segs = qrcodegen.QrSegment.makeSegments(text);
            return QrCode.encodeSegments(segs, ecl);
        }
        // Returns a QR Code representing the given binary data at the given error correction level.
        // This function always encodes using the binary segment mode, not any text mode. The maximum number of
        // bytes allowed is 2953. The smallest possible QR Code version is automatically chosen for the output.
        // The ECC level of the result may be higher than the ecl argument if it can be done without increasing the version.
        static encodeBinary(data, ecl) {
            const seg = qrcodegen.QrSegment.makeBytes(data);
            return QrCode.encodeSegments([seg], ecl);
        }
        /*-- Static factory functions (mid level) --*/
        // Returns a QR Code representing the given segments with the given encoding parameters.
        // The smallest possible QR Code version within the given range is automatically
        // chosen for the output. Iff boostEcl is true, then the ECC level of the result
        // may be higher than the ecl argument if it can be done without increasing the
        // version. The mask number is either between 0 to 7 (inclusive) to force that
        // mask, or -1 to automatically choose an appropriate mask (which may be slow).
        // This function allows the user to create a custom sequence of segments that switches
        // between modes (such as alphanumeric and byte) to encode text in less space.
        // This is a mid-level API; the high-level API is encodeText() and encodeBinary().
        static encodeSegments(segs, ecl, minVersion = 1, maxVersion = 40, mask = -1, boostEcl = true) {
            if (!(QrCode.MIN_VERSION <= minVersion && minVersion <= maxVersion && maxVersion <= QrCode.MAX_VERSION)
                || mask < -1 || mask > 7)
                throw new RangeError("Invalid value");
            // Find the minimal version number to use
            let version;
            let dataUsedBits;
            for (version = minVersion;; version++) {
                const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8; // Number of data bits available
                const usedBits = QrSegment.getTotalBits(segs, version);
                if (usedBits <= dataCapacityBits) {
                    dataUsedBits = usedBits;
                    break; // This version number is found to be suitable
                }
                if (version >= maxVersion) // All versions in the range could not fit the given data
                    throw new RangeError("Data too long");
            }
            // Increase the error correction level while the data still fits in the current version number
            for (const newEcl of [QrCode.Ecc.MEDIUM, QrCode.Ecc.QUARTILE, QrCode.Ecc.HIGH]) { // From low to high
                if (boostEcl && dataUsedBits <= QrCode.getNumDataCodewords(version, newEcl) * 8)
                    ecl = newEcl;
            }
            // Concatenate all segments to create the data bit string
            let bb = [];
            for (const seg of segs) {
                appendBits(seg.mode.modeBits, 4, bb);
                appendBits(seg.numChars, seg.mode.numCharCountBits(version), bb);
                for (const b of seg.getData())
                    bb.push(b);
            }
            assert(bb.length == dataUsedBits);
            // Add terminator and pad up to a byte if applicable
            const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8;
            assert(bb.length <= dataCapacityBits);
            appendBits(0, Math.min(4, dataCapacityBits - bb.length), bb);
            appendBits(0, (8 - bb.length % 8) % 8, bb);
            assert(bb.length % 8 == 0);
            // Pad with alternating bytes until data capacity is reached
            for (let padByte = 0xEC; bb.length < dataCapacityBits; padByte ^= 0xEC ^ 0x11)
                appendBits(padByte, 8, bb);
            // Pack bits into bytes in big endian
            let dataCodewords = [];
            while (dataCodewords.length * 8 < bb.length)
                dataCodewords.push(0);
            bb.forEach((b, i) => dataCodewords[i >>> 3] |= b << (7 - (i & 7)));
            // Create the QR Code object
            return new QrCode(version, ecl, dataCodewords, mask);
        }
        /*-- Accessor methods --*/
        // Returns the color of the module (pixel) at the given coordinates, which is false
        // for light or true for dark. The top left corner has the coordinates (x=0, y=0).
        // If the given coordinates are out of bounds, then false (light) is returned.
        getModule(x, y) {
            return 0 <= x && x < this.size && 0 <= y && y < this.size && this.modules[y][x];
        }
        /*-- Private helper methods for constructor: Drawing function modules --*/
        // Reads this object's version field, and draws and marks all function modules.
        drawFunctionPatterns() {
            // Draw horizontal and vertical timing patterns
            for (let i = 0; i < this.size; i++) {
                this.setFunctionModule(6, i, i % 2 == 0);
                this.setFunctionModule(i, 6, i % 2 == 0);
            }
            // Draw 3 finder patterns (all corners except bottom right; overwrites some timing modules)
            this.drawFinderPattern(3, 3);
            this.drawFinderPattern(this.size - 4, 3);
            this.drawFinderPattern(3, this.size - 4);
            // Draw numerous alignment patterns
            const alignPatPos = this.getAlignmentPatternPositions();
            const numAlign = alignPatPos.length;
            for (let i = 0; i < numAlign; i++) {
                for (let j = 0; j < numAlign; j++) {
                    // Don't draw on the three finder corners
                    if (!(i == 0 && j == 0 || i == 0 && j == numAlign - 1 || i == numAlign - 1 && j == 0))
                        this.drawAlignmentPattern(alignPatPos[i], alignPatPos[j]);
                }
            }
            // Draw configuration data
            this.drawFormatBits(0); // Dummy mask value; overwritten later in the constructor
            this.drawVersion();
        }
        // Draws two copies of the format bits (with its own error correction code)
        // based on the given mask and this object's error correction level field.
        drawFormatBits(mask) {
            // Calculate error correction code and pack bits
            const data = this.errorCorrectionLevel.formatBits << 3 | mask; // errCorrLvl is uint2, mask is uint3
            let rem = data;
            for (let i = 0; i < 10; i++)
                rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
            const bits = (data << 10 | rem) ^ 0x5412; // uint15
            assert(bits >>> 15 == 0);
            // Draw first copy
            for (let i = 0; i <= 5; i++)
                this.setFunctionModule(8, i, getBit(bits, i));
            this.setFunctionModule(8, 7, getBit(bits, 6));
            this.setFunctionModule(8, 8, getBit(bits, 7));
            this.setFunctionModule(7, 8, getBit(bits, 8));
            for (let i = 9; i < 15; i++)
                this.setFunctionModule(14 - i, 8, getBit(bits, i));
            // Draw second copy
            for (let i = 0; i < 8; i++)
                this.setFunctionModule(this.size - 1 - i, 8, getBit(bits, i));
            for (let i = 8; i < 15; i++)
                this.setFunctionModule(8, this.size - 15 + i, getBit(bits, i));
            this.setFunctionModule(8, this.size - 8, true); // Always dark
        }
        // Draws two copies of the version bits (with its own error correction code),
        // based on this object's version field, iff 7 <= version <= 40.
        drawVersion() {
            if (this.version < 7)
                return;
            // Calculate error correction code and pack bits
            let rem = this.version; // version is uint6, in the range [7, 40]
            for (let i = 0; i < 12; i++)
                rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
            const bits = this.version << 12 | rem; // uint18
            assert(bits >>> 18 == 0);
            // Draw two copies
            for (let i = 0; i < 18; i++) {
                const color = getBit(bits, i);
                const a = this.size - 11 + i % 3;
                const b = Math.floor(i / 3);
                this.setFunctionModule(a, b, color);
                this.setFunctionModule(b, a, color);
            }
        }
        // Draws a 9*9 finder pattern including the border separator,
        // with the center module at (x, y). Modules can be out of bounds.
        drawFinderPattern(x, y) {
            for (let dy = -4; dy <= 4; dy++) {
                for (let dx = -4; dx <= 4; dx++) {
                    const dist = Math.max(Math.abs(dx), Math.abs(dy)); // Chebyshev/infinity norm
                    const xx = x + dx;
                    const yy = y + dy;
                    if (0 <= xx && xx < this.size && 0 <= yy && yy < this.size)
                        this.setFunctionModule(xx, yy, dist != 2 && dist != 4);
                }
            }
        }
        // Draws a 5*5 alignment pattern, with the center module
        // at (x, y). All modules must be in bounds.
        drawAlignmentPattern(x, y) {
            for (let dy = -2; dy <= 2; dy++) {
                for (let dx = -2; dx <= 2; dx++)
                    this.setFunctionModule(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) != 1);
            }
        }
        // Sets the color of a module and marks it as a function module.
        // Only used by the constructor. Coordinates must be in bounds.
        setFunctionModule(x, y, isDark) {
            this.modules[y][x] = isDark;
            this.isFunction[y][x] = true;
        }
        /*-- Private helper methods for constructor: Codewords and masking --*/
        // Returns a new byte string representing the given data with the appropriate error correction
        // codewords appended to it, based on this object's version and error correction level.
        addEccAndInterleave(data) {
            const ver = this.version;
            const ecl = this.errorCorrectionLevel;
            if (data.length != QrCode.getNumDataCodewords(ver, ecl))
                throw new RangeError("Invalid argument");
            // Calculate parameter numbers
            const numBlocks = QrCode.NUM_ERROR_CORRECTION_BLOCKS[ecl.ordinal][ver];
            const blockEccLen = QrCode.ECC_CODEWORDS_PER_BLOCK[ecl.ordinal][ver];
            const rawCodewords = Math.floor(QrCode.getNumRawDataModules(ver) / 8);
            const numShortBlocks = numBlocks - rawCodewords % numBlocks;
            const shortBlockLen = Math.floor(rawCodewords / numBlocks);
            // Split data into blocks and append ECC to each block
            let blocks = [];
            const rsDiv = QrCode.reedSolomonComputeDivisor(blockEccLen);
            for (let i = 0, k = 0; i < numBlocks; i++) {
                let dat = data.slice(k, k + shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1));
                k += dat.length;
                const ecc = QrCode.reedSolomonComputeRemainder(dat, rsDiv);
                if (i < numShortBlocks)
                    dat.push(0);
                blocks.push(dat.concat(ecc));
            }
            // Interleave (not concatenate) the bytes from every block into a single sequence
            let result = [];
            for (let i = 0; i < blocks[0].length; i++) {
                blocks.forEach((block, j) => {
                    // Skip the padding byte in short blocks
                    if (i != shortBlockLen - blockEccLen || j >= numShortBlocks)
                        result.push(block[i]);
                });
            }
            assert(result.length == rawCodewords);
            return result;
        }
        // Draws the given sequence of 8-bit codewords (data and error correction) onto the entire
        // data area of this QR Code. Function modules need to be marked off before this is called.
        drawCodewords(data) {
            if (data.length != Math.floor(QrCode.getNumRawDataModules(this.version) / 8))
                throw new RangeError("Invalid argument");
            let i = 0; // Bit index into the data
            // Do the funny zigzag scan
            for (let right = this.size - 1; right >= 1; right -= 2) { // Index of right column in each column pair
                if (right == 6)
                    right = 5;
                for (let vert = 0; vert < this.size; vert++) { // Vertical counter
                    for (let j = 0; j < 2; j++) {
                        const x = right - j; // Actual x coordinate
                        const upward = ((right + 1) & 2) == 0;
                        const y = upward ? this.size - 1 - vert : vert; // Actual y coordinate
                        if (!this.isFunction[y][x] && i < data.length * 8) {
                            this.modules[y][x] = getBit(data[i >>> 3], 7 - (i & 7));
                            i++;
                        }
                        // If this QR Code has any remainder bits (0 to 7), they were assigned as
                        // 0/false/light by the constructor and are left unchanged by this method
                    }
                }
            }
            assert(i == data.length * 8);
        }
        // XORs the codeword modules in this QR Code with the given mask pattern.
        // The function modules must be marked and the codeword bits must be drawn
        // before masking. Due to the arithmetic of XOR, calling applyMask() with
        // the same mask value a second time will undo the mask. A final well-formed
        // QR Code needs exactly one (not zero, two, etc.) mask applied.
        applyMask(mask) {
            if (mask < 0 || mask > 7)
                throw new RangeError("Mask value out of range");
            for (let y = 0; y < this.size; y++) {
                for (let x = 0; x < this.size; x++) {
                    let invert;
                    switch (mask) {
                        case 0:
                            invert = (x + y) % 2 == 0;
                            break;
                        case 1:
                            invert = y % 2 == 0;
                            break;
                        case 2:
                            invert = x % 3 == 0;
                            break;
                        case 3:
                            invert = (x + y) % 3 == 0;
                            break;
                        case 4:
                            invert = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 == 0;
                            break;
                        case 5:
                            invert = x * y % 2 + x * y % 3 == 0;
                            break;
                        case 6:
                            invert = (x * y % 2 + x * y % 3) % 2 == 0;
                            break;
                        case 7:
                            invert = ((x + y) % 2 + x * y % 3) % 2 == 0;
                            break;
                        default: throw new Error("Unreachable");
                    }
                    if (!this.isFunction[y][x] && invert)
                        this.modules[y][x] = !this.modules[y][x];
                }
            }
        }
        // Calculates and returns the penalty score based on state of this QR Code's current modules.
        // This is used by the automatic mask choice algorithm to find the mask pattern that yields the lowest score.
        getPenaltyScore() {
            let result = 0;
            // Adjacent modules in row having same color, and finder-like patterns
            for (let y = 0; y < this.size; y++) {
                let runColor = false;
                let runX = 0;
                let runHistory = [0, 0, 0, 0, 0, 0, 0];
                for (let x = 0; x < this.size; x++) {
                    if (this.modules[y][x] == runColor) {
                        runX++;
                        if (runX == 5)
                            result += QrCode.PENALTY_N1;
                        else if (runX > 5)
                            result++;
                    }
                    else {
                        this.finderPenaltyAddHistory(runX, runHistory);
                        if (!runColor)
                            result += this.finderPenaltyCountPatterns(runHistory) * QrCode.PENALTY_N3;
                        runColor = this.modules[y][x];
                        runX = 1;
                    }
                }
                result += this.finderPenaltyTerminateAndCount(runColor, runX, runHistory) * QrCode.PENALTY_N3;
            }
            // Adjacent modules in column having same color, and finder-like patterns
            for (let x = 0; x < this.size; x++) {
                let runColor = false;
                let runY = 0;
                let runHistory = [0, 0, 0, 0, 0, 0, 0];
                for (let y = 0; y < this.size; y++) {
                    if (this.modules[y][x] == runColor) {
                        runY++;
                        if (runY == 5)
                            result += QrCode.PENALTY_N1;
                        else if (runY > 5)
                            result++;
                    }
                    else {
                        this.finderPenaltyAddHistory(runY, runHistory);
                        if (!runColor)
                            result += this.finderPenaltyCountPatterns(runHistory) * QrCode.PENALTY_N3;
                        runColor = this.modules[y][x];
                        runY = 1;

<script>// NonaFiksi game wiring — scripts on top of the data (catalog + scenes).
// Expects globals: NF (engine), NF_ASSETS, NF_CATALOG, NF_SCENES, qrcodegen
// (build.py inlines these for the single-file build).
"use strict";
(function(){
const wire = (api)=>{
  const S = api.scenes();
  const $ = id=>document.getElementById(id);
  const slug = s=>(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'').slice(0,24)||'tamu';

  // API base: localStorage nf_api overrides (a URL, or 'off' to force offline
  // in dev); default is the live worker. Offline still degrades cleanly.
  const NF_API = localStorage.nf_api==='off' ? ''
    : (localStorage.nf_api || 'https://nonafiksi-api.giyaibo.workers.dev');
  const post = (path,body)=>NF_API
    ? fetch(NF_API+path,{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify(body)})
    : Promise.reject(new Error('offline'));
  const get = (path)=>NF_API ? fetch(NF_API+path) : Promise.reject(new Error('offline'));
  // kunci rumah: the claim token minted by the worker on first save. Losing it
  // means losing remote edit rights (by design — no email/OAuth yet).
  const TOKEN = { get:()=>localStorage.nf_token||'', set:t=>{localStorage.nf_token=t;} };
  const showKunci = (t,baru)=>{ try{navigator.clipboard.writeText(t);}catch(e){}
    api.popup({title:'KUNCI RUMAHMU ✦',
      body:(baru?'Rumahmu resmi tercatat di percetakan! ':'')+
      'Ini kunci rumahmu — satu-satunya cara masuk kembali dari ponsel lain atau '+
      'setelah data browser terhapus. Sudah kusalin ke clipboard, simpan baik-baik: '+
      t+' — lihat lagi kapan saja lewat pintu rumah → KUNCI RUMAH.'}); };

  // ---- title screen ----
  api.state.playerSheet = localStorage.nf_char||'boy';
  if(api.persona.get()) $('bLanjut').style.display='block';
  $('bMulai').onpointerdown = e=>{ e.preventDefault();
    $('tbtns').style.display='none'; $('chsel').style.display='flex'; };
  document.querySelectorAll('.chcard').forEach(c=>c.onpointerdown=e=>{ e.preventDefault();
    localStorage.nf_char=c.dataset.k; api.state.playerSheet=c.dataset.k;
    api.begin('warung',72,224); });
  $('bLanjut').onpointerdown = e=>{ e.preventDefault(); api.begin('rumah',72,190); };
  $('bKredit').onpointerdown = e=>{ e.preventDefault(); api.popup({title:'KREDIT & SUMBER',
    body:'Aset pixel: Cozy Farm, Ninja Adventure, Kenney, dkk — CC0; daftar per berkas di repo '+
      '(web/assets/SUMBER.md). QR: Project Nayuki (MIT). Font: Press Start 2P & VT323 (OFL). '+
      'Semua tokoh cerita adalah fiksi komposit. Dicetak hangat. ☕'}); };

  // ---- kartu profil: QR + shareable card (a proper little press card) ----
  const cardURL=(per)=>'nonafiksi.pages.dev/@'+per.handle;
  const rr=(g,x,y,w,h,r)=>{ g.beginPath();
    g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
    g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); };
  const makeCard=(per)=>{
    const cv=document.createElement('canvas'); cv.width=384; cv.height=624;
    const g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
    // frame: kopi mount + kayu bevel + kertas face
    g.fillStyle='#1a120d'; g.fillRect(0,0,384,624);
    g.fillStyle='#2a1d14'; g.fillRect(12,12,360,600);
    g.fillStyle='#3a2a1c'; g.fillRect(20,20,344,584);
    g.fillStyle='#f2e8d5'; g.fillRect(28,28,328,568);
    // tinta header band + avatar plate framed
    g.fillStyle='#303b7a'; g.fillRect(28,28,328,120);
    g.fillStyle='#4a57a8'; g.fillRect(28,142,328,6);      // ink seam
    const sh=api.sheet(api.state.playerSheet);
    g.fillStyle='#1a120d'; g.fillRect(150,60,84,84);
    g.fillStyle='#f2e8d5'; g.fillRect(156,66,72,72);
    g.drawImage(sh,0,0,16,16,160,70,64,64);
    g.textAlign='center';
    // name + handle
    g.fillStyle='#1a120d'; g.font='20px PS2P,monospace';
    g.fillText((per.nama||'TAMU').toUpperCase().slice(0,14),192,192);
    g.fillStyle='#c4553b'; g.font='24px VT323,monospace';
    g.fillText('@'+per.handle,192,220);
    if(per.quote){ g.fillStyle='#5a4a34'; g.font='19px VT323,monospace';
      g.fillText('“'+String(per.quote).slice(0,34)+'”',192,244); }
    // QR on a white tile
    const url='https://'+cardURL(per);
    const qr=qrcodegen.QrCode.encodeText(url,qrcodegen.QrCode.Ecc.MEDIUM);
    const m=qr.size, px=Math.max(4,(212/m)|0), qs=m*px, off=((384-qs)/2)|0, top=262;
    g.fillStyle='#ffffff'; rr(g,off-14,top-14,qs+28,qs+28,10); g.fill();
    g.fillStyle='#1a120d';
    for(let y=0;y<m;y++)for(let x=0;x<m;x++)
      if(qr.getModule(x,y))g.fillRect(off+x*px,top+y*px,px,px);
    // scan-or-type label + the plain URL (this is what goes in a bio)
    g.fillStyle='#8a7a5c'; g.font='9px PS2P,monospace';
    g.fillText('PINDAI ATAU KETIK',192,top+qs+34);
    g.fillStyle='#303b7a'; g.font='22px VT323,monospace';
    g.fillText(cardURL(per),192,top+qs+58);
    // footer mark
    g.fillStyle='#c4553b'; g.font='9px PS2P,monospace';
    g.fillText('NONAFIKSI ✦ DICETAK HANGAT',192,584);
    return cv; };
  const shareCard=(per)=>{
    const url=cardURL(per);
    try{ navigator.clipboard.writeText(url); }catch(e){}
    makeCard(per).toBlob(async b=>{
      const f=new File([b],'nonafiksi-'+per.handle+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){
        try{ await navigator.share({files:[f],title:'NonaFiksi',
          text:'Rumahku di NonaFiksi ✦ '+url}); return; }catch(e){} }
      const a=document.createElement('a'); a.href=URL.createObjectURL(b);
      a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),5000);
      // surface the plain link too — for IG/X bios (image QR isn't copyable)
      api.popup({title:'KARTU & TAUTAN ✦',
        body:'Kartumu tersimpan. Tautan rumahmu — '+url+' — sudah kusalin ke '+
          'papan tempel; tempel saja di bio IG atau X-mu. ✦'}); }); };

  // ---- rumah ----
  const saveRumah = (p)=>{ let plan=null;
    try{ plan=JSON.parse(localStorage.nf_plan||'null'); }catch(e){}
    return post('/api/rumah',{handle:p.handle,persona:p,manifest:plan?{plan}:{},
        token:TOKEN.get()||undefined,terdaftar:p.terdaftar?1:0})
      .then(r=>r.json()).then(r=>{
        if(r.token){ TOKEN.set(r.token); showKunci(r.token,r.baru); }
        return r; }); };
  // handle taken by someone else (409) → suffix and retry, max 3 hops
  const claimRumah = (p,depth)=>saveRumah(p).then(r=>{
    if(r&&r.error==='sudah dipakai'&&(depth||0)<3){
      p.handle=p.handle.replace(/-\d+$/,'').slice(0,21)+'-'+((10+Math.random()*90)|0);
      api.persona.set(p); placeHomeOnStreet();
      return claimRumah(p,(depth||0)+1); }
    return r; });

  // ubah rumah — the home IS the linktree; editing = re-pressing the manifest
  const ubahRumah = ()=>{ const p=api.persona.get(); if(!p)return; p.links=p.links||[];
    const commit=()=>{ api.closeDlg(); api.persona.set(p); buildRumah(p);

        kontribusi:"Kontribusi keluargamu yang bulan lalu saja masih dihitung… akuntan. Iya. Akuntan.",
        golf:"Visi bangsamu delapan belas lubang, Bakri, dan semuanya par."}[jaw])},
      {say:"Intinya: rakyat menonton. Untungnya saluran TV-nya… punyamu juga, ya? (Kalian tertawa. Kalian berdua tahu.)"},
      {say:"(Lanjut lewat pintu bawah: KONFERENSI PERS.)"}],
      'PAK DEWAN (FIKSI)'); };

  S.oli3.onTalk=()=>{ let head='';
    api.runScript([
      {say:"Pak Bakri! Satu pertanyaan: tanggapan Bapak soal izin tambang di hutan adat?"},
      {say:"(Pilih jawaban terbaikmu:)",choices:[
        {label:"“Optimalisasi lahan tidur”",then:()=>head="HEADLINE BESOK: “BAKRI: HUTAN ADAT = LAHAN TIDUR”. Tiga demonstrasi. Satu meme abadi."},
        {label:"“Kami berdampingan dengan warga”",then:()=>head="HEADLINE BESOK: “BERDAMPINGAN: RUMAH WARGA KINI DI SAMPING LUBANG”."},
        {label:"“Tanya anak perusahaan saja”",then:()=>head="HEADLINE BESOK: “BAKRI TAK KENAL PERUSAHAANNYA SENDIRI”. Sahamnya ikut tidur."}]},
      {say:()=>head},
      {say:"(Setiap jawaban memperburuk keadaan. Kau tersenyum ke kamera — senyum tiga puluh tahun latihan.)"},
      {say:"(TAMAT — BAB 1.)",action:endOligarki}],
      'WARTAWAN (FIKSI)'); };

  // ---- Nona Aksara di warung ----
  // She is not a menu. She notices you (time, how often you come, what you've
  // trusted her with) and stories arrive as things she HEARD, not products.
  const SMALL={
    pagi:["Pagi. Kopi pertama selalu yang paling jujur.","Roti baru keluar — baunya seperti niat baik."],
    siang:["Siang begini cerita datang lebih pelan, tapi lebih dalam.","Panas di luar. Duduk dulu, dingin dulu."],
    sore:["Sore itu jam emas percetakan — semua orang tiba-tiba ingin bercerita.","Lampu-lampu mulai kunyalakan satu per satu."],
    malam:["Malam. Jam paling ramai kisah, paling sepi jalan.","Dengar jangkrik di luar? Koor tetap warung ini."]};
  const opener=(per,n)=>{ const ph=api.phase();
    let cur=[]; try{cur=JSON.parse(localStorage.nf_curhat||'[]');}catch(e){}
    if(cur.length&&n%4===3)
      return "Cerita yang kau titipkan tempo hari — masih kusimpan di laci. Kadang kubaca ulang kalau warung sepi. ✦";
    if(ph==='malam'&&n>2)
      return "Kau lagi, malam-malam begini. Duduk. Kelihatannya ada yang belum selesai di kepalamu.";
    if(n===1) return "Kembali juga. Kursi yang itu — sudah kuanggap kursimu.";
    return SMALL[ph][n%SMALL[ph].length]; };
  const GOSIP=[
    "(Ia mengelap cangkir, mencondongkan badan.) Kemarin malam ada tamu. Jas licin, jam tangan berat, memesan yang paling mahal. Lalu bercerita seperti orang mengaku dosa. Kutulis diam-diam.",
    "(Ia melirik ke jendela.) Orang-orang di jalan membicarakan tamu berjas itu lagi. Katanya semua pintu terbuka untuknya — tapi tak satu pun rumah. Ceritanya masih di laciku.",
    "(Ia menuang kopi tanpa ditanya.) Kota ini penuh cerita yang belum selesai. Yang paling berat justru dari orang yang paling ringan tertawanya. Tamu berjas itu, misalnya."];

  // recovery: new phone / wiped browser → handle + kunci → rumah restored
  const pulihkan = ()=>{ const rec={};
    api.runScript([
      {say:"Sebutkan alamat rumahmu — si @handle.",input:true,placeholder:"handle…",
        oninput:v=>rec.handle=slug(v.replace(/^@/,''))},
      {say:"Dan kuncinya? (yang kuberikan waktu rumahmu pertama dicetak)",input:true,
        placeholder:"xxxxxxxx-xxxx-…",oninput:v=>rec.token=v.trim()},
      {say:"Sebentar, kubuka arsipnya…",action:()=>{
        post('/api/rumah/cek',{handle:rec.handle,token:rec.token})
          .then(r=>r.json()).then(r=>{
            if(!r.ok)return api.popup({title:'TIDAK COCOK',
              body:'Alamat dan kunci itu tidak berjodoh di arsipku. Periksa lagi hurufnya.'});
            TOKEN.set(rec.token);
            if(r.manifest&&r.manifest.plan)try{
              localStorage.nf_plan=JSON.stringify(r.manifest.plan); }catch(e){}
            api.persona.set(r.persona); buildRumah(r.persona);
            refreshPulang(); placeHomeOnStreet();
            api.runScript([{say:"Ketemu. Selamat datang kembali, "+(r.persona.nama||'kawan')+
              " — rumahmu masih hangat, persis seperti kau tinggalkan. ✦",
              action:()=>api.goto('rumah',72,190)}]); })
          .catch(()=>api.popup({title:'OFFLINE',
            body:'Percetakan tak terjangkau. Coba lagi saat daring.'}));}}]); };

  // ---- Aksara HIDUP — her words are LLM-written live (worker gateway: NIM
  // GLM primary → Gemini fallback), deterministically validated server-side.
  // The scripted lines below survive ONLY as the boot fallback when every
  // lane is dark; mid-chat failures stay in fiction ("ada telepon") + retry.
  let AKSARA_LANE=null; // null = unknown yet (still try), 'mati' = no keys
  if(NF_API) get('/api/health').then(r=>r.json())
    .then(h=>{AKSARA_LANE=h.aksara||'mati';}).catch(()=>{AKSARA_LANE='mati';});
  else AKSARA_LANE='mati';
  const SESI=()=>{ let s=localStorage.nf_sesi;
    if(!s){ s=crypto.randomUUID(); localStorage.nf_sesi=s; } return s; };
  let ivPhase='nama'; // onboarding funnel step: nama→link→vibe→quote→penutup
  const AKSTATE=()=>{ const per=api.persona.get();
    return { baru:!per, nama:per&&per.nama, handle:per&&per.handle,
      visits:+localStorage.nf_talks||0, jam:new Date().getHours(), fase:api.phase(),
      tahap:ivPhase }; };
  const TELEPON=[
    "Eh — sebentar, telepon dari percetakan. (Ia mengangkat gagang telepon tua, menjepitnya dengan bahu.) Jangan ke mana-mana. ☕",
    "Aduh, tunggu — kurir kertas datang di pintu belakang. Sebentar saja, jangan pergi dulu!",
    "(Mesin kopi mendesis keras minta perhatian.) Wah, sebentar ya — dia cemburuan kalau kuabaikan."];
  let draftLLM={}; // interview answers accumulate here until done+commit
  const dispatch=(v)=>{
    if(v==='#pergi')return api.closeDlg();
    if(v==='#ubah'){api.closeDlg();return ubahRumah();}
    if(v==='#kartu'){api.closeDlg();const p=api.persona.get();
      if(p)shareCard(p); return;}
    if(v==='#oligarki')return startOligarki();
    if(v==='#kunci')return pulihkan();
    kirim({pesan:v}); };
  const kirim=(payload)=>{
    api.runScript([{say:'☕ …'}]); // she pours, thinks; the reply replaces this
    post('/api/aksara',{sesi:SESI(),state:AKSTATE(),...payload})
      .then(r=>r.json()).then(r=>render(r,payload))
      .catch(()=>gagal(payload)); };
  let gagalN=0; // 2 strikes → she offers the paper notebook (scripted flow)
  const gagal=(payload)=>{ gagalN++;
    const ch=[{label:'KUTUNGGU, NONA',then:()=>kirim(payload)},
      {label:'Lain kali saja ☕',then:()=>{gagalN=0;api.closeDlg();}}];
    if(gagalN>=2)ch.splice(1,0,{label:'PAKAI BUKU CATATAN SAJA ✦',
      then:()=>{gagalN=0;AKSARA_LANE='mati';api.closeDlg();S.warung.onTalk();}});
    api.runScript([{say:gagalN>=2
      ?"(Ia kembali, agak terengah.) Maaf, maaf — hari ini percetakan rewel sekali. Kalau kau buru-buru, kita pakai buku catatan kertasku saja dulu?"
      :TELEPON[(Math.random()*TELEPON.length)|0],choices:ch}]); };
  const commitInterview=(d,sayAkhir)=>{
    d.nama=d.nama||'Tamu'; d.handle=d.handle||slug(d.nama);
    d.links=d.links||[]; d.vibe=d.vibe||'hangat';
    d.halaman=d.halaman||['kotak-surat','pot-bunga']; // a yard that greets you
    api.persona.set(d); buildRumah(d); refreshPulang(); placeHomeOnStreet();
    // claim FIRST (mints the kunci; bangun needs row + token), then decorate
    claimRumah(d)
      .then(()=>post('/api/bangun',{handle:d.handle,token:TOKEN.get(),persona:d}))
      .then(r=>r.json()).then(r=>{ if(r.plan){ applyPlan(r.plan);
        saveRumah(d).catch(()=>{}); } }).catch(()=>{});
    api.runScript([
      {say:sayAkhir||"(Ia menutup buku catatannya.) Dengar itu? Mesin cetaknya menyala — rumahmu sedang DICETAK, halaman demi halaman. ✦"},
      {say:"Kuantar lewat jalan pintas penulis — lurus MENEMBUS halaman. Rumahmu juga di ujung selatan Jalan Kenangan, kalau mau pulang jalan kaki. ✦",
        action:()=>api.goto('rumah',72,190)}]); };
  // Onboarding is a fixed funnel; the CLIENT owns the buttons AND captures the
  // data (the model's patch is a refinement, not a requirement — a weak fallback
  // lane that returns patch:null still can't lose your name). This also kills
  // the "example-answer-as-a-button" bug and speeds turns (she writes a line,
  // not a menu). ivPhase = what she is asking for THIS turn.
  const cleanName=(v)=>{ const s=String(v).trim()
    .replace(/^(halo[,!.\s]+)?(nama\s?(ku|\s?saya)?|panggil(\s?aku|\s?saja)?|aku|saya)\s+/i,'')
    .replace(/[.!,]+$/,'').trim();
    return (s||String(v).trim()).slice(0,24); };
  const normURL=(v)=>{ let u=String(v).trim(); if(!u)return '';
    if(!/^https?:\/\//i.test(u))u='https://'+u.replace(/^\/+/,''); return u.slice(0,200); };
  const labelFor=(u)=>{ try{ const h=new URL(u).hostname.replace(/^www\./,'');
    if(/instagram/.test(h))return 'Instagram'; if(/tiktok/.test(h))return 'TikTok';
    if(/(^|\.)x\.com|twitter/.test(h))return 'X'; if(/youtu/.test(h))return 'YouTube';
    if(/github/.test(h))return 'GitHub'; if(/linkedin/.test(h))return 'LinkedIn';
    if(/spotify/.test(h))return 'Spotify';
    return h.split('.')[0].replace(/^\w/,c=>c.toUpperCase()); }catch(e){return 'Tautan';} };
  const ivSend=(pesan,next)=>{ ivPhase=next; kirim({pesan}); };
  const ivVibe=(v)=>{ draftLLM.vibe=v; ivSend('rumahku '+v,'quote'); };
  const ivAffordance=(step)=>{
    if(ivPhase==='nama'){ step.input=true; step.placeholder='namamu…';
      step.onfree=v=>{ draftLLM.nama=cleanName(v); ivSend(v,'link'); };
      step.choices=[{label:'AKU SUDAH PUNYA RUMAH ✦',then:()=>{api.closeDlg();pulihkan();}}]; }
    else if(ivPhase==='link'){ step.input=true; step.placeholder='https://…  (IG, toko, dst)';
      step.onfree=v=>{ const u=normURL(v); if(u)draftLLM.links=[{label:labelFor(u),url:u}];
        ivSend(v,'vibe'); };
      step.choices=[{label:'BELUM ADA — LEWATI ✦',then:()=>ivSend('aku belum punya tautan','vibe')}]; }
    else if(ivPhase==='vibe'){ step.choices=[
      {label:'HANGAT — selimut & kopi',then:()=>ivVibe('hangat')},
      {label:'RAPI — semua pada tempatnya',then:()=>ivVibe('rapi')},
      {label:'RAMAI — tamu & tanaman',then:()=>ivVibe('ramai')}]; }
    else if(ivPhase==='quote'){ step.input=true; step.placeholder='kutipan dinding…';
      step.onfree=v=>{ draftLLM.quote=String(v).slice(0,90); ivSend(v,'penutup'); };
      step.choices=[{label:'BIAR NONA YANG PILIH ✦',then:()=>ivSend('biar kamu yang pilih kutipannya','penutup')}]; }
  };
  const render=(r,payload)=>{
    if(!r||r.macet||r.error)return gagal(payload);
    if(r.mati){ AKSARA_LANE='mati'; api.closeDlg(); return S.warung.onTalk(); }
    gagalN=0;
    if(r.tutup||r.sibuk)return api.runScript([{say:r.say||'Besok lagi ya. ☕'}]);
    const per=api.persona.get();
    if(!per){ // ONBOARDING — client drives the funnel, options are deterministic
      if(r.patch)Object.assign(draftLLM,r.patch);
      if(ivPhase==='penutup')return commitInterview({...draftLLM},r.say);
      const step={say:r.say}; ivAffordance(step);
      return api.runScript([step],'NONA AKSARA'); }
    // RETURNING — model-driven choices (validated + clamped upstream)
    if(r.patch){ Object.assign(per,r.patch); api.persona.set(per);
      buildRumah(per); placeHomeOnStreet(); saveRumah(per).catch(()=>{}); }
    const step={say:r.say};
    const ch=(r.choices||[]).map(c=>({label:c.label,then:()=>dispatch(c.value)}));
    if(ch.length)step.choices=ch;
    if(r.expect==='text'){ step.input=true; step.placeholder='…tulis jawabanmu';
      if(ch.length)step.onfree=v=>kirim({pesan:v});
      else step.oninput=v=>kirim({pesan:v}); }
    api.runScript([step]); };

  S.warung.onTalk = ()=>{
    if(NF_API&&AKSARA_LANE!=='mati'){ // LIVE mode (unknown lane = still try)
      localStorage.nf_talks=(+localStorage.nf_talks||0)+1;
      if(!api.persona.get()){ draftLLM={}; ivPhase='nama'; }
      return kirim({buka:true}); }
    const per = api.persona.get();
    if(!per){
      const draft = {links:[]};
      api.runScript([
        {say:"Selamat datang di Warung Pusat. Aku Aksara — penjaga percetakan ini. Kopi dulu? Cangkir pertama kutraktir. ✦",choices:[
          {label:"AKU BARU — tuliskan aku, Nona",then:()=>api.runScript(wawancara(draft))},
          {label:"Rumahku sudah ada — aku bawa kunci",then:pulihkan}]}]);
      return;
    }
    onTalkKembali(per);
  };
  const wawancara = (draft)=>[
        {say:"Sebelum kutulis apa pun — siapa namamu?",input:true,placeholder:"namamu…",
          oninput:v=>draft.nama=v},
        {say:()=>"Salam kenal, "+draft.nama+". Tautan yang paling menceritakan dirimu? (portofolio, IG, apa saja)",
          input:true,placeholder:"https://…",
          oninput:v=>draft.links.push({label:"Tautanku",url:v.startsWith('http')?v:'https://'+v})},
        {say:"Terakhir — rumah seperti apa dirimu?",choices:[
          {label:"HANGAT — selimut & kopi",then:()=>draft.vibe='hangat'},
          {label:"RAPI — semua pada tempatnya",then:()=>draft.vibe='rapi'},
          {label:"RAMAI — tamu & tanaman",then:()=>draft.vibe='ramai'}]},
        {say:"Cukup. (Ia menutup buku catatannya dan berdiri.) Dengar itu? Mesin cetaknya sudah menyala — rumahmu sedang DICETAK, halaman demi halaman. ✦",
          action:()=>{draft.handle=slug(draft.nama);api.persona.set(draft);buildRumah(draft);refreshPulang();placeHomeOnStreet();
            // claim FIRST (mints the kunci; bangun needs row + token), then decorate
            claimRumah(draft)
              .then(()=>post('/api/bangun',{handle:draft.handle,token:TOKEN.get(),persona:draft}))
              .then(r=>r.json()).then(r=>{ if(r.plan){ applyPlan(r.plan);
                saveRumah(draft).catch(()=>{}); } }).catch(()=>{});}},
        {say:()=>"Selesai, "+draft.nama+". Tintanya masih hangat. (Ia meniup halaman terakhir, lalu tersenyum.) Kuantar kau lewat jalan pintas penulis — lurus MENEMBUS halaman. Rumahmu di ujung jalan, selatan, kalau mau pulang jalan kaki nanti. ✦",
          action:()=>api.goto('rumah',72,190)}];
  const onTalkKembali = (per)=>{
      const n=(+localStorage.nf_talks||0); localStorage.nf_talks=n+1;
      api.runScript([
        {say:opener(per,n)},
        {say:GOSIP[n%GOSIP.length]},
        {say:"Jadi — bagaimana, "+(per.nama||'kau')+"?",
          input:true,placeholder:"…atau ketik apa saja",onfree:hear,
          choices:[
          {label:"Tamu berjas itu… ceritakan",then:()=>api.runScript([
            {say:"Menceritakan saja tidak cukup untuk yang satu ini."},
            {say:"Duduk yang nyaman. Kuseduhkan sesuatu — dan kau akan menjalaninya DARI DALAM. Dari kursinya. ☕",
              action:startOligarki}])},
          {label:"Cerita dari timur itu?",locked:true,
            lockedMsg:"…yang itu belum boleh kubuka. Sedang ditulis pelan-pelan, dengan restu keluarganya. Yang seperti itu tidak boleh terburu-buru. ✦"},
          {label:"Aku yang mau cerita, Nona",then:()=>{api.closeDlg();api.runScript([
            {say:"(Ia menutup buku tulisnya, menatapmu.) Nah. Dari tadi kelihatan. Ceritakan.",
              input:true,placeholder:"ketik ceritamu…",oninput:hearStore},
            {say:"…kucatat, kata demi kata. Mesin cetak besarnya masih menunggu kopi — tapi ceritamu aman di laciku. ☕"}])}},
          {label:"Cuma mampir, Nona",then:()=>api.runScript([
            {say:"Mampir itu juga cerita — cuma pendek. (Ia mendorong sepiring kecil pisang goreng.) Bawa. Jangan bilang siapa-siapa."}])}]}]);
  };
};
NF.init({sheets:NF_ASSETS,catalog:NF_CATALOG,scenes:NF_SCENES,start:'street',wire});
})();
</script>
