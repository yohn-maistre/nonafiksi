<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NonaFiksi</title>
<style>
@font-face{font-family:'PS2P';src:url(data:font/woff2;base64,__PS2P__) format('woff2');font-display:swap}
@font-face{font-family:'VT323';src:url(data:font/woff2;base64,__VT323__) format('woff2');font-display:swap}
:root{--kopi:#1a120d;--kayu:#2a1d14;--kayu2:#3a2a1c;--kertas:#f2e8d5;--kertas2:#e4d5b8;
--tinta:#303b7a;--terakota:#c4553b;--kunyit:#e3a62f}
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--kopi);overflow:hidden}
body{font-family:'VT323',monospace;color:var(--kertas);display:flex;flex-direction:column}
.hud{display:flex;justify-content:space-between;align-items:center;
  font-family:'PS2P',monospace;font-size:8px;color:var(--kertas2);padding:8px 10px;letter-spacing:1px}
.hud b{color:var(--kunyit);font-weight:normal}
#phasebtn{cursor:pointer;border:2px solid var(--kayu2);padding:4px 6px;background:var(--kayu);color:var(--kunyit)}
.screen{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;
  height:min(calc(100vh - 150px), calc((100vw - 10px) * 256 / 144));
  border:3px solid var(--kayu2);box-shadow:0 0 0 3px #000,0 10px 40px rgba(0,0,0,.6);background:#000}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s}
.fade.on{opacity:1}
.dialog{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  width:min(94%,540px);background:var(--kayu);border:3px solid var(--kertas);
  box-shadow:0 0 0 3px var(--kayu2),5px 5px 0 rgba(0,0,0,.5);padding:10px 14px 12px;display:none}
.dialog.on{display:block}
.dialog .who{position:absolute;top:-15px;left:8px;font-family:'PS2P',monospace;font-size:8px;
  background:var(--kunyit);color:var(--kopi);border:2px solid var(--kopi);padding:3px 7px}
.dialog p{margin:4px 0 0;font-size:22px;line-height:1.25}
#dinput{display:none;width:100%;margin-top:8px;font-family:'VT323',monospace;font-size:22px;
  background:var(--kopi);color:var(--kertas);border:2px solid var(--kertas2);padding:6px 8px;outline:none}
#dchoices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chc{font-family:'PS2P',monospace;font-size:9px;text-align:left;padding:9px 10px;cursor:pointer;
  background:var(--kertas);color:var(--kopi);border:2px solid var(--kopi);box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.chc.lock{background:var(--kayu2);color:var(--kertas2)}
.popup{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
.popup.on{display:flex}
.pcard{width:min(88%,420px);background:var(--kertas);color:var(--kopi);border:3px solid var(--kopi);
  box-shadow:0 0 0 3px var(--kertas2),6px 6px 0 rgba(0,0,0,.5);padding:14px}
.pcard h3{font-family:'PS2P',monospace;font-size:11px;color:var(--tinta);margin:0 0 8px}
.pcard p{font-size:22px;margin:0 0 10px;word-break:break-word}
.pcard a{display:none;font-family:'PS2P',monospace;font-size:9px;background:var(--kunyit);
  color:var(--kopi);border:2px solid var(--kopi);padding:8px 10px;text-decoration:none;margin-right:8px}
#pclose{font-family:'PS2P',monospace;font-size:9px;background:var(--kayu);color:var(--kertas);
  border:2px solid var(--kayu2);padding:8px 10px;cursor:pointer}
.padwrap{position:relative;padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
.ctx{position:absolute;top:-46px;left:50%;transform:translateX(-50%);
  font-family:'PS2P',monospace;font-size:10px;color:var(--kopi);background:var(--kunyit);
  border:3px solid #8a6318;box-shadow:0 4px 0 #000;padding:11px 18px;cursor:pointer;
  user-select:none;-webkit-user-select:none;visibility:hidden;white-space:nowrap;z-index:3}
.ctx.on{visibility:visible}
.ctx:active{transform:translateX(-50%) translateY(3px);box-shadow:0 1px 0 #000}
.pad{display:flex;justify-content:space-between;gap:8px}
.cluster{display:flex;gap:8px}
.btn{font-family:'PS2P',monospace;font-size:14px;color:var(--kertas);background:var(--kayu);
  border:3px solid var(--kayu2);box-shadow:0 4px 0 #000;width:64px;padding:16px 0;text-align:center;
  user-select:none;-webkit-user-select:none;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
</style>

<div class="hud"><span id="loc">…</span><span id="phasebtn">AUTO ✦</span><span>KOPI <b id="kopi">☕☕☕</b></span></div>
<div class="screen">
  <canvas id="cv" width="144" height="256"></canvas>
  <div class="fade" id="fade"></div>
  <div class="dialog" id="dlg"><span class="who" id="who">NONA AKSARA</span>
    <p><span id="dtxt"></span></p>
    <input id="dinput" autocomplete="off" spellcheck="false">
    <div id="dchoices"></div></div>
  <div class="popup" id="pop"><div class="pcard">
    <h3 id="ptitle"></h3><p id="pbody"></p>
    <a id="plink" target="_blank" rel="noopener"></a><button id="pclose">TUTUP</button>
  </div></div>
</div>
<div class="padwrap">
  <div class="ctx" id="ctx"></div>
  <div class="pad">
    <div class="btn" data-k="L">◀</div>
    <div class="cluster"><div class="btn" data-k="D">▼</div><div class="btn" data-k="U">▲</div></div>
    <div class="btn" data-k="R">▶</div>
  </div>
</div>
