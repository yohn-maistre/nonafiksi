name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'worker/**', 'wrangler.toml', 'tools/build.py', '.github/workflows/deploy.yml']

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Build single-file game
        run: |
          python3 tools/build.py
          mkdir -p pages-dist && cp dist/nonafiksi.html pages-dist/index.html
          if [ -f web/_redirects ]; then cp web/_redirects pages-dist/_redirects; fi

      - name: Deploy Pages
        run: |
          npx wrangler@4 pages project create nonafiksi --production-branch=main 2>/dev/null || true
          npx wrangler@4 pages deploy pages-dist --project-name=nonafiksi --commit-dirty=true

      - name: Bootstrap D1 (idempotent) and wire database_id
        run: |
          npx wrangler@4 d1 create nonafiksi 2>/dev/null || true
          ID=$(npx wrangler@4 d1 list --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const x=JSON.parse(d).find(r=>r.name==='nonafiksi');console.log(x.uuid)})")
          echo "D1 id: $ID"
          sed -i "s/TBD-after-wrangler-d1-create/$ID/" wrangler.toml
          npx wrangler@4 d1 execute nonafiksi --remote --file worker/schema.sql
          # column insurance: no-ops on a fresh DB, upgrades an old rumah table in place
          npx wrangler@4 d1 execute nonafiksi --remote --command "ALTER TABLE rumah ADD COLUMN secret_hash TEXT" 2>/dev/null || true
          npx wrangler@4 d1 execute nonafiksi --remote --command "ALTER TABLE rumah ADD COLUMN bangun_day TEXT" 2>/dev/null || true
          npx wrangler@4 d1 execute nonafiksi --remote --command "ALTER TABLE rumah ADD COLUMN bangun_count INTEGER NOT NULL DEFAULT 0" 2>/dev/null || true
          npx wrangler@4 d1 execute nonafiksi --remote --command "ALTER TABLE rumah ADD COLUMN terdaftar INTEGER NOT NULL DEFAULT 0" 2>/dev/null || true

      - name: Deploy Worker (API + NonaAgent DO)
        run: npx wrangler@4 deploy

      - name: Set NIM key (optional — /api/bangun lights up when present)
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: |
          if [ -n "$NIM_API_KEY" ]; then
            printf '%s' "$NIM_API_KEY" | npx wrangler@4 secret put NIM_API_KEY
          else echo "NIM_API_KEY not set yet — /api/bangun stays in fallback mode"; fi
